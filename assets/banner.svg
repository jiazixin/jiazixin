<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="jiazixin — 自托管工具 · 云原生基础设施 · 单二进制交付">
  <style>
    :root { --bg:#f6f8fa; --edge:#d0d7de; --ink:#1f2328; --mute:#59636e; --line:#0969da; --acc:#1a7f37; --term:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --edge:#30363d; --ink:#e6edf3; --mute:#9198a1; --line:#4493f8; --acc:#3fb950; --term:#161b22; }
    }
    .bg { fill: var(--bg); stroke: var(--edge); }
    .contour { fill: none; stroke: var(--line); stroke-width: 1.2; opacity: .16; }
    .name { fill: var(--ink); font: 700 64px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -1px; }
    .tag { fill: var(--mute); font: 500 22px -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 1px; }
    .term { fill: var(--term); stroke: var(--edge); }
    .mono { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .p { fill: var(--acc); } .c { fill: var(--ink); } .o { fill: var(--mute); }
    .dot1 { fill: #ff5f57; } .dot2 { fill: #febc2e; } .dot3 { fill: #28c840; }
    .cursor { fill: var(--acc); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1199" height="279" rx="16"/>

  <!-- 等高线纹样 -->
  <g class="contour">
    <path d="M1200 40 C1080 30 1010 90 940 70 S820 0 760 -10"/>
    <path d="M1200 80 C1070 70 1000 140 920 115 S800 40 720 20"/>
    <path d="M1200 125 C1060 115 990 190 900 160 S780 80 690 60"/>
    <path d="M1200 170 C1050 160 980 240 880 205 S760 125 660 105"/>
    <path d="M1200 215 C1040 205 970 290 860 250 S740 170 630 150"/>
    <path d="M1200 260 C1030 250 960 340 840 295 S720 215 600 195"/>
    <path d="M-20 250 C80 230 140 270 230 255 S360 210 420 230"/>
    <path d="M-20 280 C90 262 150 300 250 285 S380 245 450 262"/>
  </g>

  <text class="name" x="64" y="122">jiazixin</text>
  <text class="tag" x="66" y="168">自托管工具 · 云原生基础设施 · 单二进制交付</text>

  <!-- 终端卡片 -->
  <g transform="translate(704 64)">
    <rect class="term" x="0.5" y="0.5" width="431" height="151" rx="10"/>
    <circle class="dot1" cx="20" cy="20" r="5.5"/>
    <circle class="dot2" cx="38" cy="20" r="5.5"/>
    <circle class="dot3" cx="56" cy="20" r="5.5"/>
    <text class="mono" x="20" y="62"><tspan class="p">$</tspan><tspan class="c"> go build -o app ./cmd/...</tspan></text>
    <text class="mono" x="20" y="88"><tspan class="o">  ✓ web/dist embedded · no CDN · no DB</tspan></text>
    <text class="mono" x="20" y="114"><tspan class="p">$</tspan><tspan class="c"> ./app --config config.yaml</tspan></text>
    <rect class="cursor" x="20" y="126" width="9" height="16"/>
  </g>

  <text class="o mono" x="66" y="232">Go · TypeScript · Vue · React · Docker · Harbor</text>
</svg>
